[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tecknet-gm2793"
version = "0.2.0"
description = "Native Linux configuration application for the TeckNet GM2793-1"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
tecknet-mouse = "tecknet.__main__:main"

[tool.setuptools]
packages = ["tecknet"]
